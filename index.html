    <style>

        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Tier hlavičky (záře + gradient) */
        .tier-header-1 {
            border-top: 3px solid #f59e0b;

            color: #fbbf24;
        }
        .tier-header-2 {
            border-top: 3px solid #94a3b8;
            background: linear-gradient(180deg, rgba(148, 163, 184, 0.13) 0%, rgba(20, 22, 34, 0.45) 100%);
            box-shadow: 0 -12px 28px -6px rgba(148, 163, 184, 0.18);
            color: #cbd5e1;
        }
        .tier-header-3 {
            border-top: 3px solid #ea580c;
            background: linear-gradient(180deg, rgba(234, 88, 12, 0.16) 0%, rgba(20, 22, 34, 0.45) 100%);
            box-shadow: 0 -12px 28px -6px rgba(234, 88, 12, 0.22);
            color: #f97316;
        }
        .tier-header-4 {
            border-top: 3px solid #6366f1;
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.14) 0%, rgba(20, 22, 34, 0.45) 100%);
            box-shadow: 0 -12px 28px -6px rgba(99, 102, 241, 0.18);

        }
        .tier-header-5 {
            border-top: 3px solid #8b5cf6;

            color: #a78bfa;
        }

        .tier-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.4rem;
            padding: 0.1rem 0.35rem;
            margin-left: 0.4rem;
            border-radius: 9999px;
            font-size: 10px;
            font-weight: 900;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            vertical-align: middle;
        }

        /* HT / LT rozlišení karet */
        .player-card-ht {
            background: linear-gradient(180deg, #1d2130 0%, #181b28 100%);
            border: 1px solid #2b3045;
        }
        .player-card-lt {
            background: linear-gradient(180deg, #13151d 0%, #10121a 100%);
            border: 1px solid #1e2230;
        }
        .player-card-ht:hover { border-color: #3b4160; }
        .player-card-lt:hover { border-color: #2c3246; }

        /* Skeleton loading */
        .skeleton {
            background: linear-gradient(90deg, #16181f 25%, #1e212b 37%, #16181f 63%);
            background-size: 400% 100%;
            animation: shimmer 1.4s ease infinite;
            border-radius: 0.75rem;
        }
        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* Modaly */
        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0s 0.2s;
        }
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition: opacity 0.2s ease;
        }
        .modal-panel {
            opacity: 0;
            transform: translateY(10px) scale(0.98);

        }
        .modal-overlay.open .modal-panel {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

    <script>
        const tierConfig = {
            'HT1': { points: 60, label: 'HT1' },
            'LT1': { points: 48, label: 'LT1' },
            'RHT1': { points: 54, label: 'RHT1' },
            'RLT1': { points: 44, label: 'RLT1' },
            'HT2': { points: 32, label: 'HT2' },
            'LT2': { points: 24, label: 'LT2' },
            'RHT2': { points: 29, label: 'RHT2' },
            'RLT2': { points: 22, label: 'RLT2' },
            'HT3': { points: 16, label: 'HT3' },
            'LT3': { points: 10, label: 'LT3' },
            'RHT3': { points: 14, label: 'RHT3' },
            'RLT3': { points: 8, label: 'RLT3' },
            'HT4': { points: 5,  label: 'HT4' },
            'LT4': { points: 3,  label: 'LT4' },
            'RHT4': { points: 4,  label: 'RHT4' },
            'RLT4': { points: 2,  label: 'RLT4' },
            'HT5': { points: 2,  label: 'HT5' },
            'LT5': { points: 1,  label: 'LT5' },
            'RHT5': { points: 1,  label: 'RHT5' },
            'RLT5': { points: 1,  label: 'RLT5' }
        };

        const tierOrder = ['HT1','LT1','RHT1','RLT1','HT2','LT2','RHT2','RLT2','HT3','LT3','RHT3','RLT3','HT4','LT4','RHT4','RLT4','HT5','LT5','RHT5','RLT5'];

        // Kity s obrázkem (PNG); ostatní dostanou emoji lopaty
        const PNG_KITS = ['GoldSMP', 'NetheriteSword', 'IronAxe', 'UHCMace', 'AnchorPvP', 'RandomPot', 'ShieldlessSMP'];

        function kitLogo(mode, cls, emojiSize) {
            const m = String(mode);
            if (PNG_KITS.includes(m)) {
                return `<img src="${m}.png" alt="${m}" class="${cls}">`;
            }
            return `<span class="inline-flex items-center justify-center ${cls} leading-none" style="font-size:${emojiSize || 16}px" title="${m}" aria-hidden="true">⛏️</span>`;
        }

        function getAllKits() {
            const found = new Set();
            playersData.forEach(p => {
                if (p && p.modes) Object.keys(p.modes).forEach(k => found.add(k));
            });
            const png = PNG_KITS.filter(k => found.has(k));
            const extra = [...found].filter(k => !PNG_KITS.includes(k)).sort((a, b) => a.localeCompare(b));
            return [...png, ...extra];
        }

        let playersData = [];
        let currentTab = 'Overall';
        let activeModalPlayer = null;
        let showRetired = false;
        let chartState = null;
        let searchIndex = -1;

        /* ---------- Modaly ---------- */
        function openModal(id) {
            document.getElementById(id).classList.add('open');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
            if (id === 'vs-modal') {
                openModal('compare-select-modal');
            }
        }
        function closeModalOnBackdrop(event, id) {
            if (event.target.id === id) {
                closeModal(id);
            }
        }

        /* ---------- Načítání dat ---------- */
        function renderSkeleton() {
            const container = document.getElementById('leaderboard-container');
            const skeletons = Array.from({ length: 7 }, () =>
                `<div class="flex items-center justify-between p-4 rounded-xl border border-gray-900/60 bg-gray-950/30">
                    <div class="flex items-center gap-4">
                        <div class="skeleton w-12 h-12 rounded-xl"></div>
                        <div class="space-y-2">
                            <div class="skeleton w-40 h-4"></div>
                            <div class="skeleton w-24 h-3"></div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <div class="skeleton w-10 h-10 rounded-xl"></div>
                        <div class="skeleton w-10 h-10 rounded-xl"></div>
                        <div class="skeleton w-10 h-10 rounded-xl"></div>
                    </div>
                </div>`
            ).join('');
            container.innerHTML = `<div class="space-y-3">${skeletons}</div>`;
        }

        function renderError() {
            const container = document.getElementById('leaderboard-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center gap-4 py-24 text-center">
                    <div class="w-16 h-16 rounded-2xl bg-red-500/10 border border-red-500/30 flex items-center justify-center text-3xl">⚠️</div>
                    <div>
                        <h3 class="text-lg font-black text-white">Nepodařilo se načíst data</h3>
                        <p class="text-sm text-gray-500 mt-1">Ovlivni, že soubor <code class="text-gray-400 bg-gray-900 px-1.5 py-0.5 rounded">players.json</code> existuje a zkus to znovu.</p>
                    </div>
                    <button id="retry-btn" class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-sm transition shadow-lg shadow-amber-500/20">Zkusit znovu</button>
                </div>`;
            const retryBtn = document.getElementById('retry-btn');
            if (retryBtn) retryBtn.addEventListener('click', loadData);
        }

        function getLastUpdateDate() {
            let latest = null;
            playersData.forEach(p => {
                const hist = p && p.history;
                if (!hist) return;
                Object.values(hist).forEach(arr => {
                    (arr || []).forEach(e => {
                        const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(e.date || ''));
                        if (!m) return;
                        const d = new Date(+m[3], +m[2] - 1, +m[1]);
                        if (!latest || d > latest) latest = d;
                    });
                });
            });
            if (!latest) return '—';
            const dd = String(latest.getDate()).padStart(2, '0');
            const mm = String(latest.getMonth() + 1).padStart(2, '0');
            return `${dd}.${mm}.${latest.getFullYear()}`;
        }

        async function loadData() {
            const container = document.getElementById('leaderboard-container');
            renderSkeleton();

            try {
                const response = await fetch('players.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('Neplatný formát');
                playersData = data;

                const countElem = document.getElementById('player-count');
                if (countElem) countElem.innerText = playersData.length;

                const updateElem = document.getElementById('last-update');
                if (updateElem) updateElem.innerText = getLastUpdateDate();

                if (!getAllKits().includes(currentTab) && currentTab !== 'Overall') {
                    currentTab = 'Overall';
                }
                buildTabs();
                renderRecentTests();
                render();
            } catch (e) {
                console.error('Chyba při načítání players.json', e);
                renderError();
            }
        }

        /* ---------- Záložky ---------- */
        function buildTabs() {
            const tabsEl = document.getElementById('tabs');
            if (!tabsEl) return;

            const kits = getAllKits();
            tabsEl.innerHTML = '';

            const overallBtn = document.createElement('button');
            overallBtn.onclick = () => switchTab('Overall');
            overallBtn.id = 'tab-Overall';
            overallBtn.className = 'px-5 py-2 rounded-lg font-bold transition flex items-center gap-2 bg-amber-500 text-black shadow-lg shadow-amber-500/20 whitespace-nowrap';
            overallBtn.innerHTML = 'Overall 🏆';
            tabsEl.appendChild(overallBtn);

            kits.forEach(kit => {
                const btn = document.createElement('button');
                btn.onclick = () => switchTab(kit);
                btn.id = 'tab-' + kit;
                btn.className = 'px-4 py-2 rounded-lg font-bold text-gray-400 hover:text-white hover:bg-gray-900/60 transition flex items-center gap-2 whitespace-nowrap';
                btn.innerHTML = kitLogo(kit, 'w-5 h-5 object-contain', 16) + ' ' + kit;
                tabsEl.appendChild(btn);
            });

            switchTab(currentTab, true);
        }

        function switchTab(tabId, skipRender) {
            currentTab = tabId;
            document.querySelectorAll('#tabs button').forEach(btn => {
                btn.className = "px-4 py-2 rounded-lg font-bold text-gray-400 hover:text-white hover:bg-gray-900/60 transition flex items-center gap-2 whitespace-nowrap";
            });
            const activeBtn = document.getElementById('tab-' + tabId);
            if (activeBtn) {
                activeBtn.className = "px-5 py-2 rounded-lg font-bold transition bg-amber-500 text-black shadow-lg shadow-amber-500/20 flex items-center gap-2 whitespace-nowrap";
            }

            const retiredBox = document.getElementById('retired-container');
            if (retiredBox) {
                if (tabId === 'Overall') {
                    retiredBox.classList.add('hidden');
                } else {
                    retiredBox.classList.remove('hidden');
                }
            }

            if (!skipRender) render();
        }

        function toggleRetired() {
            showRetired = !showRetired;
            const toggleBtn = document.getElementById('toggle-retired-btn');
            if (toggleBtn) {
                if (showRetired) {
                    toggleBtn.className = "px-4 py-2 rounded-full font-bold text-amber-400 bg-amber-500/10 border border-amber-500/40 transition flex items-center gap-2 text-xs shadow-lg shadow-amber-500/10";
                } else {
                    toggleBtn.className = "px-4 py-2 rounded-full font-bold text-gray-400 hover:text-white bg-gray-900 border border-gray-800 hover:border-gray-700 transition flex items-center gap-2 text-xs";
                }
            }
            render();
        }

        /* ---------- Recent tests ---------- */
        function renderRecentTests() {
            const container = document.getElementById('recent-tests-container');
            const listContainer = document.getElementById('recent-tests-list');
            if (!container || !listContainer) return;

            const recentTests = [];

            playersData.forEach(player => {
                if (!player.history) return;

                Object.keys(player.history).forEach(mode => {
                    const modeEntries = player.history[mode];
                    modeEntries.forEach((entry, idx) => {
                        const parts = String(entry.date).split('.');
                        if (parts.length !== 3) return;
                        const dateObj = new Date(parts[2], parts[1] - 1, parts[0]);

                        let trend = 'up';
                        if (idx > 0) {
                            const prevTier = modeEntries[idx - 1].tier;
                            const prevIdx = tierOrder.indexOf(prevTier);
                            const currIdx = tierOrder.indexOf(entry.tier);
                            if (currIdx > prevIdx) trend = 'down';
                            else if (currIdx === prevIdx) trend = 'same';
                        }

                        recentTests.push({
                            username: player.username,
                            mode: mode,
                            tier: entry.tier,
                            dateStr: entry.date,
                            dateObj: dateObj,
                            trend: trend
                        });
                    });
                });
            });

            if (recentTests.length === 0) {
                container.classList.add('hidden');
                return;
            }

            recentTests.sort((a, b) => b.dateObj - a.dateObj);

            const latest = recentTests.slice(0, 8);
            listContainer.innerHTML = '';

            latest.forEach(item => {
                let arrowIcon = '▲';
                let arrowColor = 'text-emerald-400';
                if (item.trend === 'down') {
                    arrowIcon = '▼';
                    arrowColor = 'text-red-400';
                } else if (item.trend === 'same') {
                    arrowIcon = '•';
                    arrowColor = 'text-gray-400';
                }

                const card = document.createElement('div');
                card.className = "flex items-center gap-3 bg-[#13151f] border border-gray-800/80 px-3.5 py-2 rounded-xl flex-shrink-0 shadow-md hover:border-amber-500/30 hover:-translate-y-px transition";
                card.innerHTML = `
                    <img src="https://minotar.net/avatar/${item.username}/32" alt="${item.username}" class="w-7 h-7 rounded-lg bg-gray-800 flex-shrink-0">
                    <div class="flex flex-col">
                        <span class="font-extrabold text-xs text-white leading-tight">${item.username}</span>
                        <span class="text-[10px] text-gray-500 font-medium">${item.dateStr}</span>
                    </div>
                    ${kitLogo(item.mode, 'w-4 h-4 object-contain ml-1', 16)}
                    <span class="px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/30 text-amber-400 font-black text-xs">${item.tier}</span>
                    <span class="${arrowColor} text-xs font-black" aria-hidden="true">${arrowIcon}</span>
                `;
                listContainer.appendChild(card);
            });

            container.classList.remove('hidden');
        }

        /* ---------- Bodování a tituly ---------- */
        function calculateOverallPoints(player) {
            let total = 0;
            let hasRetired = false;
            if (player && player.modes) {
                for (const m in player.modes) {
                    const tier = player.modes[m];
                    const cfg = tierConfig[tier];
                    if (cfg) total += cfg.points;
                    if (tier.startsWith('R')) hasRetired = true;
                }
            }
            return { total, hasRetired };
        }

        function getSortedModes(modes) {
            if (!modes) return [];
            return Object.entries(modes).sort((a, b) => {
                const idxA = tierOrder.indexOf(a[1]);
                const idxB = tierOrder.indexOf(b[1]);
                return (idxA !== -1 ? idxA : 999) - (idxB !== -1 ? idxB : 999);
            });
        }

        function getFavoriteKit(player) {
            if (!player.modes || Object.keys(player.modes).length === 0) return 'Žádný';
            const sorted = getSortedModes(player.modes);
            if (sorted.length === 0) return 'Žádný';
            const [bestKit, bestTier] = sorted[0];
            return `${bestKit} (${bestTier})`;
        }

        function getRankTitle(player) {
            if (player.isBestCZSK) {
                return { title: 'BEST CZECHIA', bg: 'bg-red-500/20 text-yellow-400 border-red-500/50 shadow-sm' };
            }
            const points = player.overallScore || 0;
            if (points >= 240) return { title: 'THE BEST', bg: 'bg-red-500/20 text-red-400 border-red-500/30' };
            if (points >= 210) return { title: 'Legenda', bg: 'bg-purple-500/20 text-purple-400 border-purple-500/30' };
            if (points >= 180) return { title: 'Elita', bg: 'bg-cyan-500/20 text-cyan-400 border-cyan-500/30' };
            if (points >= 120) return { title: 'Expert', bg: 'bg-amber-500/20 text-amber-400 border-amber-500/30' };
            if (points >= 70)  return { title: 'Úspěšný', bg: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' };
            if (points >= 30)  return { title: 'Pokročilý', bg: 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30' };
            return { title: 'Začátečník', bg: 'bg-slate-500/20 text-slate-400 border-slate-500/30' };
        }

        /* ---------- Render ---------- */
        function renderPlayerCard(player, isRetired) {
            const rawTier = player.modes[currentTab];
            const isHT = String(rawTier).includes('HT');
            const cardClass = isHT ? 'player-card-ht' : 'player-card-lt';

            const item = document.createElement('div');
            item.className = `flex items-center justify-between p-2.5 ${cardClass} rounded-2xl cursor-pointer transition duration-200 group hover:scale-[1.02] hover:shadow-lg hover:shadow-black/40 shadow-sm`;
            item.onclick = () => openPlayerModal(player);
            item.setAttribute('role', 'button');
            item.setAttribute('tabindex', '0');
            item.onkeydown = (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPlayerModal(player); }
            };

            let retiredBadge = isRetired
                ? `<span class="px-2 py-0.5 bg-[#201625] border border-[#3b2048] text-[#d884f3] font-black text-[10px] rounded-md tracking-wider">R</span>`
                : '';

            item.innerHTML = `
                <div class="flex items-center gap-2.5 overflow-hidden">
                    <img src="https://minotar.net/avatar/${player.username}/32" alt="${player.username}" class="w-7 h-7 rounded-lg bg-gray-800 flex-shrink-0 border border-gray-700/50">
                    <span class="font-bold text-xs text-white truncate tracking-wide group-hover:text-amber-400 transition">${player.username}</span>
                </div>
                ${retiredBadge}
            `;
            return item;
        }

        function render() {
            const container = document.getElementById('leaderboard-container');
            if (!container) return;
            container.innerHTML = '';

            if (playersData.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center gap-3 py-24 text-center">
                        <div class="text-4xl">🐾</div>
                        <h3 class="text-lg font-black text-gray-300">Zatím žádní hráči</h3>
                        <p class="text-sm text-gray-500">Až testeri zapíšou první výsledky, objeví se tady.</p>
                    </div>`;
                return;
            }

            let processedPlayers = playersData.map(p => {
                const score = calculateOverallPoints(p);
                return { ...p, overallScore: score.total, isRetired: score.hasRetired };
            });

            if (currentTab === 'Overall') {
                container.className = "space-y-6";
                processedPlayers.sort((a, b) => {
                    if (a.isBestCZSK && !b.isBestCZSK) return -1;
                    if (!a.isBestCZSK && b.isBestCZSK) return 1;
                    if (a.isRetired !== b.isRetired) return a.isRetired ? 1 : -1;
                    return b.overallScore - a.overallScore;
                });

                if (processedPlayers.length >= 3) {
                    const top3 = [processedPlayers[1], processedPlayers[0], processedPlayers[2]];
                    const podiumContainer = document.createElement('div');
                    podiumContainer.className = "flex flex-col md:flex-row justify-center items-end gap-5 mb-14 mt-8";

                    const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };

                    top3.forEach((player, idx) => {
                        const rankNum = idx === 1 ? 1 : (idx === 0 ? 2 : 3);
                        const rankInfo = getRankTitle(player);
                        const medal = medals[rankNum];

                        let rankBorderGlow = "";
                        let avatarBorder = "";
                        let medalColor = "bg-amber-700";
                        let customHeightClass = "";

                        if (rankNum === 1) {
                            rankBorderGlow = "border-amber-500 shadow-[0_0_45px_rgba(234,179,8,0.28)] z-10 md:-translate-y-4";
                            avatarBorder = "border-amber-400 ring-4 ring-amber-500/20";
                            medalColor = "bg-amber-400";
                            customHeightClass = "md:w-[38%] py-10 px-8 bg-[#141622]";
                        } else if (rankNum === 2) {
                            rankBorderGlow = "border-slate-500/60 shadow-[0_0_25px_rgba(203,213,225,0.18)]";
                            avatarBorder = "border-slate-300";
                            medalColor = "bg-slate-300";
                            customHeightClass = "md:w-[31%] py-7 px-6 bg-[#11131a]";
                        } else {
                            rankBorderGlow = "border-amber-800/60 shadow-[0_0_25px_rgba(180,83,9,0.18)]";
                            avatarBorder = "border-amber-700";
                            medalColor = "bg-amber-700";
                            customHeightClass = "md:w-[31%] py-7 px-6 bg-[#11131a]";
                        }

                        const card = document.createElement('div');
                        card.className = `w-full ${customHeightClass} border-2 ${rankBorderGlow} rounded-3xl flex flex-col items-center cursor-pointer transition-all duration-300 hover:scale-[1.02] relative`;
                        card.onclick = () => openPlayerModal(player);
                        card.setAttribute('role', 'button');

                        const sortedModes = getSortedModes(player.modes);
                        const badgesHTML = sortedModes.map(([mode, t]) => `
                            <div class="flex items-center gap-1.5 bg-gray-950/80 px-2.5 py-1.5 rounded-xl border border-gray-800/80 shadow-sm" title="${mode}">
                                ${kitLogo(mode, 'w-4 h-4 object-contain', 16)}
                                <span class="text-xs font-black text-amber-400 tracking-wide">${t}</span>
                            </div>
                        `).join('');

                        const avatarSize = rankNum === 1 ? 'w-24 h-24' : 'w-20 h-20';
                        const nameSize = rankNum === 1 ? 'text-2xl' : 'text-xl';

                        card.innerHTML = `
                            <div class="w-10 h-10 rounded-xl ${medalColor} flex items-center justify-center text-xl mb-4 shadow-md" aria-hidden="true">${medal}</div>
                            <img src="https://minotar.net/avatar/${player.username}/96" alt="${player.username}" class="${avatarSize} rounded-2xl bg-gray-900 border-2 ${avatarBorder} mb-3 shadow-xl">
                            <h3 class="font-black text-white ${nameSize} tracking-wide text-center">${player.username}</h3>
                            <div class="flex items-center gap-2 mt-2 mb-6 flex-wrap justify-center">
                                <span class="text-sm font-extrabold text-amber-400">${player.overallScore} bodů</span>
                                <span class="px-2.5 py-0.5 rounded text-[11px] font-extrabold border ${rankInfo.bg}">${rankInfo.title}</span>
                            </div>
                            <div class="w-full bg-[#0a0b0e]/90 p-3 rounded-2xl border border-gray-900/80 flex flex-wrap gap-2 justify-center shadow-inner">${badgesHTML}</div>
                        `;
                        podiumContainer.appendChild(card);
                    });

                    container.appendChild(podiumContainer);
                }

                const listContainer = document.createElement('div');
                listContainer.className = "space-y-3";

                const restPlayers = processedPlayers.slice(3);

                restPlayers.forEach((player, index) => {
                    const rank = index + 4;
                    let borderClass = "border-gray-900 bg-gray-950/40";
                    const rankBadge = `<div class="w-8 text-center font-bold text-gray-500">${rank}</div>`;

                    const rankInfo = getRankTitle(player);
                    const sortedModes = getSortedModes(player.modes);

                    const badgesHTML = `
                        <div class="flex flex-wrap gap-3 items-center">
                            ${sortedModes.map(([mode, t]) => `
                                <div class="flex flex-col items-center" title="${mode}">
                                    <div class="w-10 h-10 rounded-xl bg-gray-900 border border-gray-700/80 flex items-center justify-center p-2 shadow-inner">
                                        ${kitLogo(mode, 'w-full h-full object-contain', 24)}
                                    </div>
                                    <span class="text-xs font-black text-amber-400 tracking-wide mt-1">${t}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;

                    const row = document.createElement('div');
                    row.className = `flex items-center justify-between p-4 rounded-xl border cursor-pointer transition duration-200 hover:bg-gray-900/60 hover:border-gray-700/80 hover:-translate-y-px ${borderClass}`;
                    row.onclick = () => openPlayerModal(player);
                    row.setAttribute('role', 'button');
                    row.innerHTML = `
                        <div class="flex items-center gap-4 min-w-0">
                            ${rankBadge}
                            <img src="https://minotar.net/avatar/${player.username}/48" alt="${player.username}" class="w-12 h-12 rounded-xl bg-gray-800 border border-gray-700">
                            <div class="flex flex-col justify-center min-w-0">
                                <span class="font-bold text-white tracking-wide text-base md:text-lg leading-tight truncate">${player.username}</span>
                                <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                                    <span class="text-sm font-bold text-indigo-400">${player.overallScore} bodů</span>
                                    <span class="px-2.5 py-0.5 rounded text-xs font-bold border ${rankInfo.bg}">${rankInfo.title}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center shrink-0">${badgesHTML}</div>
                    `;
                    listContainer.appendChild(row);
                });

                if (restPlayers.length === 0 && processedPlayers.length <= 3) {
                    const note = document.createElement('p');
                    note.className = "text-center text-gray-600 text-sm font-bold py-6";
                    note.innerText = processedPlayers.length < 3
                        ? 'Přidej další hráče, aby se zaplnilo pódium!'
                        : 'To je vše – top 3 na pódiu.';
                    listContainer.appendChild(note);
                }

                container.appendChild(listContainer);
            } else {
                container.className = "grid grid-cols-1 md:grid-cols-5 gap-4";

                const tiers = [1, 2, 3, 4, 5];

                tiers.forEach(tNum => {
                    const col = document.createElement('div');
                    col.className = "bg-[#0b0c12] border border-gray-900 rounded-3xl overflow-hidden flex flex-col min-h-[350px] shadow-xl";

                    const activeFiltered = processedPlayers.filter(p => {
                        if (!p.modes || !p.modes[currentTab]) return false;
                        const tStr = p.modes[currentTab];
                        return String(tStr).includes(String(tNum)) && !tStr.startsWith('R');
                    });
                    const retiredFiltered = showRetired ? processedPlayers.filter(p => {
                        if (!p.modes || !p.modes[currentTab]) return false;
                        const tStr = p.modes[currentTab];
                        return String(tStr).includes(String(tNum)) && tStr.startsWith('R');
                    }) : [];

                    const headerCount = activeFiltered.length + retiredFiltered.length;

                    col.innerHTML = `
                        <div class="text-center py-3.5 tier-header-${tNum} font-black text-sm tracking-widest uppercase flex items-center justify-center gap-1">
                            TIER ${tNum}
                            <span class="tier-count">${headerCount}</span>
                        </div>
                        <div class="flex flex-col gap-2 p-3 flex-grow" id="tier-list-${tNum}"></div>
                    `;
                    container.appendChild(col);

                    const listContainer = col.querySelector(`#tier-list-${tNum}`);

                    activeFiltered.sort((a, b) => {
                        const tA = a.modes[currentTab];
                        const tB = b.modes[currentTab];
                        return tierOrder.indexOf(tA) - tierOrder.indexOf(tB);
                    });

                    activeFiltered.forEach(player => {
                        listContainer.appendChild(renderPlayerCard(player, false));
                    });

                    retiredFiltered.sort((a, b) => {
                        const tA = a.modes[currentTab];
                        const tB = b.modes[currentTab];
                        return tierOrder.indexOf(tA) - tierOrder.indexOf(tB);
                    });

                    if (retiredFiltered.length > 0) {
                        const retiredDivider = document.createElement('div');
                        retiredDivider.className = "my-2 border-t border-gray-800/80";
                        listContainer.appendChild(retiredDivider);

                        retiredFiltered.forEach(player => {
                            listContainer.appendChild(renderPlayerCard(player, true));
                        });
                    }

                    if (activeFiltered.length === 0 && (!showRetired || listContainer.children.length === 0)) {
                        const emptyBox = document.createElement('div');
                        emptyBox.className = "m-auto flex flex-col items-center gap-1 text-gray-700 font-bold text-xs tracking-wider uppercase py-4";
                        emptyBox.innerHTML = `<span class="text-lg text-gray-800" aria-hidden="true">•</span> Prázdné`;
                        listContainer.appendChild(emptyBox);
                    }
                });
            }
        }

        /* ---------- Vyhledávání ---------- */
        function buildSearchResults(query) {
            const dropdown = document.getElementById('search-dropdown');
            if (!query) {
                dropdown.classList.add('hidden');
                searchIndex = -1;
                return;
            }

            const matches = playersData.map(p => {
                const score = calculateOverallPoints(p);
                return { ...p, overallScore: score.total };
            }).filter(p => p.username && p.username.toLowerCase().includes(query));

            if (matches.length === 0) {
                dropdown.classList.add('hidden');
                searchIndex = -1;
                return;
            }

            searchIndex = Math.min(searchIndex, matches.length - 1);
            dropdown.innerHTML = '';

            matches.forEach((player, i) => {
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 p-3 cursor-pointer border-b border-gray-900 last:border-0 transition text-white ${i === searchIndex ? 'bg-amber-500/10' : 'hover:bg-gray-900/80'}`;
                div.onclick = () => {
                    openPlayerModal(player);
                    dropdown.classList.add('hidden');
                    document.getElementById('search').value = '';
                    searchIndex = -1;
                };
                div.innerHTML = `
                    <img src="https://minotar.net/avatar/${player.username}/32" alt="${player.username}" class="w-8 h-8 rounded bg-gray-800">
                    <div class="flex flex-col">
                        <span class="font-bold text-sm">${player.username}</span>
                        <span class="text-xs text-gray-500">Skóre: ${player.overallScore}</span>
                    </div>
                `;
                dropdown.appendChild(div);
            });

            dropdown.classList.remove('hidden');
        }

        const searchInput = document.getElementById('search');
        const searchDropdown = document.getElementById('search-dropdown');

        searchInput.addEventListener('input', (e) => {
            searchIndex = -1;
            buildSearchResults(e.target.value.toLowerCase().trim());
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                const items = searchDropdown.querySelectorAll('div');
                if (items.length) {
                    searchIndex = (searchIndex + 1) % items.length;
                    buildSearchResults(searchInput.value.toLowerCase().trim());
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const items = searchDropdown.querySelectorAll('div');
                if (items.length) {
                    searchIndex = (searchIndex - 1 + items.length) % items.length;
                    buildSearchResults(searchInput.value.toLowerCase().trim());
                }
            } else if (e.key === 'Enter') {
                e.preventDefault();
                const items = searchDropdown.querySelectorAll('div');
                if (items.length && searchIndex >= 0) {
                    items[searchIndex].click();
                }
            } else if (e.key === 'Escape') {
                searchDropdown.classList.add('hidden');
                searchIndex = -1;
            }
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) {
                searchDropdown.classList.add('hidden');
                searchIndex = -1;
            }
        });

        /* ---------- Modál hráče ---------- */
        function openPlayerModal(player) {
            activeModalPlayer = player;
            if (!player.overallScore) {
                player.overallScore = calculateOverallPoints(player).total;
            }

            document.getElementById('modal-avatar').src = `https://minotar.net/avatar/${player.username}/100`;
            document.getElementById('modal-username').innerText = player.username;

            const rankInfo = getRankTitle(player);
            document.getElementById('modal-rank-badge').innerText = rankInfo.title;
            document.getElementById('modal-points').innerText = player.overallScore;
            document.getElementById('modal-title-label').innerText = rankInfo.title === 'BEST CZECHIA' ? 'Legenda' : rankInfo.title;
            document.getElementById('modal-favorite-kit').innerHTML = getFavoriteKit(player);

            const kitsContainer = document.getElementById('modal-kits-container');
            kitsContainer.innerHTML = '';

            if (player.modes) {
                const sortedModes = getSortedModes(player.modes);
                sortedModes.forEach(([mode, tier]) => {
                    const badgeDiv = document.createElement('div');
                    badgeDiv.className = "flex flex-col items-center gap-1 cursor-pointer group relative";
                    badgeDiv.onclick = () => loadHistoryChart(player.username, mode);
                    badgeDiv.setAttribute('role', 'button');
                    badgeDiv.setAttribute('aria-label', `Historie kitu ${mode}`);

                    badgeDiv.innerHTML = `
                        <div class="w-12 h-12 rounded-full flex flex-col items-center justify-center font-black bg-gray-900 border border-gray-700/80 p-2 transition group-hover:scale-110 group-hover:border-amber-500/60 group-hover:shadow-lg group-hover:shadow-amber-500/10">
                            ${kitLogo(mode, 'w-full h-full object-contain', 24)}
                        </div>
                        <span class="text-xs font-black text-amber-400 mt-0.5">${tier}</span>
                    `;
                    kitsContainer.appendChild(badgeDiv);
                });

                if (sortedModes.length > 0) {
                    requestAnimationFrame(() => loadHistoryChart(player.username, sortedModes[0][0]));
                } else {
                    chartState = null;
                }
            } else {
                chartState = null;
            }

            openModal('modal');
        }

        function openCompareSelection() {
            if (!activeModalPlayer) return;
            closeModal('modal');
            document.getElementById('compare-with-name').innerText = activeModalPlayer.username;
            document.getElementById('compare-search-input').value = '';
            buildCompareList('');
            openModal('compare-select-modal');
        }

        function buildCompareList(filterQuery) {
            const listContainer = document.getElementById('compare-players-list');
            listContainer.innerHTML = '';

            const filtered = playersData.map(p => {
                return { ...p, overallScore: calculateOverallPoints(p).total };
            }).filter(p => p.username !== activeModalPlayer.username && String(p.username).toLowerCase().includes(filterQuery.toLowerCase()));

            if (filtered.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-gray-600 text-sm font-bold py-6">Žádní hráči</div>';
                return;
            }

            filtered.forEach((player) => {
                const rankInfo = getRankTitle(player);
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 bg-gray-900/40 hover:bg-gray-900/80 border border-gray-800 rounded-xl cursor-pointer transition text-white";
                div.onclick = () => startComparison(player);
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="https://minotar.net/avatar/${player.username}/32" alt="${player.username}" class="w-8 h-8 rounded bg-gray-800">
                        <span class="font-bold text-sm">${player.username}</span>
                    </div>
                    <div class="text-right text-xs text-gray-500">
                        <span>${player.overallScore} bodů · </span>
                        <span class="text-amber-500 font-bold">${rankInfo.title}</span>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        document.getElementById('compare-search-input').addEventListener('input', (e) => {
            buildCompareList(e.target.value);
        });

        function startComparison(opponent) {
            closeModal('compare-select-modal');

            const p1 = activeModalPlayer;
            const p2 = opponent;
            const r1 = getRankTitle(p1);
            const r2 = getRankTitle(p2);

            document.getElementById('vs-p1-avatar').src = `https://minotar.net/avatar/${p1.username}/60`;
            document.getElementById('vs-p1-name').innerText = p1.username;
            document.getElementById('vs-p1-score').innerText = `${p1.overallScore} bodů`;
            document.getElementById('vs-p1-rank').innerText = r1.title;

            document.getElementById('vs-p2-avatar').src = `https://minotar.net/avatar/${p2.username}/60`;
            document.getElementById('vs-p2-name').innerText = p2.username;
            document.getElementById('vs-p2-score').innerText = `${p2.overallScore} bodů`;
            document.getElementById('vs-p2-rank').innerText = r2.title;

            const rowsContainer = document.getElementById('vs-kits-rows');
            rowsContainer.innerHTML = '';

            const allKits = getAllKits();

            allKits.forEach(kit => {
                const t1 = p1.modes ? p1.modes[kit] : null;
                const t2 = p2.modes ? p2.modes[kit] : null;

                const row = document.createElement('div');
                row.className = "flex items-center justify-between p-2.5 bg-gray-950/40 border border-gray-900 rounded-xl";
                row.innerHTML = `
                    <div class="w-20 text-center"><span class="px-3 py-1 rounded-lg text-xs font-black inline-block ${t1 ? 'text-amber-400 bg-gray-900 border border-gray-800' : 'text-gray-600'}">${t1 || '---'}</span></div>
                    <div class="flex items-center gap-2 text-sm text-gray-400 font-bold">${kitLogo(kit, 'w-4 h-4 object-contain', 16)}<span class="text-xs text-gray-500">${kit}</span></div>
                    <div class="w-20 text-center"><span class="px-3 py-1 rounded-lg text-xs font-black inline-block ${t2 ? 'text-amber-400 bg-gray-900 border border-gray-800' : 'text-gray-600'}">${t2 || '---'}</span></div>
                `;
                rowsContainer.appendChild(row);
            });

            openModal('vs-modal');
        }

        /* ---------- Tier Journey graf (vlastní canvas, bez externí knihovny) ---------- */
        function drawTierChart(canvas, entries) {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            const W = Math.max(rect.width, 60);
            const H = Math.max(rect.height, 40);

            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, W, H);

            const padL = 36, padR = 12, padT = 14, padB = 26;
            const iw = W - padL - padR;
            const ih = H - padT - padB;

            ctx.font = '600 10px -apple-system, "Segoe UI", Roboto, sans-serif';

            if (!entries || entries.length === 0) {
                ctx.fillStyle = '#475569';
                ctx.textAlign = 'center';
                ctx.fillText('Žádná data', W / 2, H / 2);
                ctx.textAlign = 'left';
                chartState = null;
                return;
            }

            const n = entries.length;
            const vals = entries.map(e => {
                const idx = tierOrder.indexOf(e.tier);
                return idx !== -1 ? tierOrder.length - idx : 0;
            });
            const lo = Math.min(...vals);
            const hi = Math.max(...vals);
            const span = Math.max(hi - lo, 1);
            const yPos = v => (hi === lo) ? padT + ih / 2 : padT + ih - ((v - lo) / span) * ih;
            const xPos = i => (n === 1) ? padL + iw / 2 : padL + (i / (n - 1)) * iw;

            const points = entries.map((e, i) => ({ x: xPos(i), y: yPos(vals[i]), date: e.date, tier: e.tier }));

            const lineColor = '#f59e0b';
            const gridColor = '#1e293b';
            const textColor = '#64748b';

            ctx.strokeStyle = gridColor;
            ctx.lineWidth = 1;
            ctx.fillStyle = textColor;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            const tickCount = 5;
            for (let t = 0; t < tickCount; t++) {
                const frac = t / (tickCount - 1);
                const v = Math.round(lo + (hi - lo) * (1 - frac));
                const ya = padT + frac * ih;
                ctx.beginPath();
                ctx.moveTo(padL, ya);
                ctx.lineTo(W - padR, ya);
                ctx.stroke();
                const tierLabel = tierOrder[tierOrder.length - v] || '';
                if (tierLabel) ctx.fillText(tierLabel, padL - 6, ya);
            }

            // X osa – data
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            const every = n > 6 ? Math.ceil(n / 6) : 1;
            points.forEach((pt, i) => {
                if (i % every !== 0 && i !== n - 1) return;
                const short = String(pt.date);
                ctx.fillText(short, pt.x, padT + ih + 8);
            });

            // Linka
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            points.forEach((pt, i) => {
                if (i === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
            });
            ctx.stroke();

            // Body
            points.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.strokeStyle = lineColor;
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Gradient pod linkou
            const grad = ctx.createLinearGradient(0, padT, 0, padT + ih);
            grad.addColorStop(0, 'rgba(245, 158, 11, 0.16)');
            grad.addColorStop(1, 'rgba(245, 158, 11, 0)');
            ctx.beginPath();
            ctx.moveTo(points[0].x, padT + ih);
            points.forEach(pt => ctx.lineTo(pt.x, pt.y));
            ctx.lineTo(points[n - 1].x, padT + ih);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            chartState = { canvas, entries, points, n };
            renderChartTooltip(chartState);

            // Hover
            canvas.onmousemove = null;
            canvas.onmouseleave = null;
            canvas.onmousemove = (e) => {
                if (!chartState) return;
                const rect2 = canvas.getBoundingClientRect();
                const mx = e.clientX - rect2.left;
                const my = e.clientY - rect2.top;
                let nearest = -1;
                let bestDist = Infinity;
                chartState.points.forEach((pt, i) => {
                    const d = (pt.x - mx) ** 2 + (pt.y - my) ** 2;
                    if (d < bestDist) { bestDist = d; nearest = i; }
                });
                if (nearest !== -1 && bestDist < 1600) {
                    if (chartState.hover !== nearest) {
                        chartState.hover = nearest;
                        renderChartTooltip(chartState, true);
                    }
                } else if (chartState.hover !== undefined) {
                    chartState.hover = undefined;
                    renderChartTooltip(chartState, false);
                }
            };
            canvas.onmouseleave = () => {
                if (chartState) {
                    chartState.hover = undefined;
                    renderChartTooltip(chartState, false);
                }
            };

            ctx.textBaseline = 'alphabetic';
        }

        function renderChartTooltip(state, force) {
            const canvas = state.canvas;
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const W = Math.max(rect.width, 60);
            const H = Math.max(rect.height, 40);
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, W, H);

            // překresli graf znovu (bez hover efektů)
            const padL = 36, padR = 12, padT = 14, padB = 26;
            const iw = W - padL - padR;
            const ih = H - padT - padB;
            const entries = state.entries;
            const n = state.n;
            const vals = entries.map(e => {
                const idx = tierOrder.indexOf(e.tier);
                return idx !== -1 ? tierOrder.length - idx : 0;
            });
            const lo = Math.min(...vals);
            const hi = Math.max(...vals);
            const span = Math.max(hi - lo, 1);
            const yPos = v => (hi === lo) ? padT + ih / 2 : padT + ih - ((v - lo) / span) * ih;
            const xPos = i => (n === 1) ? padL + iw / 2 : padL + (i / (n - 1)) * iw;
            const points = entries.map((e, i) => ({ x: xPos(i), y: yPos(vals[i]), date: e.date, tier: e.tier }));
            const grad = ctx.createLinearGradient(0, padT, 0, padT + ih);
            grad.addColorStop(0, 'rgba(245, 158, 11, 0.16)');
            grad.addColorStop(1, 'rgba(245, 158, 11, 0)');

            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padL, padT);
            ctx.lineTo(padL, padT + ih);
            ctx.lineTo(W - padR, padT + ih);
            ctx.stroke();

            ctx.font = '600 10px -apple-system, "Segoe UI", Roboto, sans-serif';
            ctx.fillStyle = '#64748b';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            const every = n > 6 ? Math.ceil(n / 6) : 1;
            points.forEach((pt, i) => {
                if (i % every !== 0 && i !== n - 1) return;
                ctx.fillText(String(pt.date), pt.x, padT + ih + 8);
            });
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            const tickCount = 5;
            for (let t = 0; t < tickCount; t++) {
                const frac = t / (tickCount - 1);
                const v = Math.round(lo + (hi - lo) * (1 - frac));
                const ya = padT + frac * ih;
                const tierLabel = tierOrder[tierOrder.length - v] || '';
                if (tierLabel) ctx.fillText(tierLabel, padL - 6, ya);
            }
            ctx.textBaseline = 'alphabetic';

            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            points.forEach((pt, i) => {
                if (i === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
            });
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(points[0].x, padT + ih);
            points.forEach(pt => ctx.lineTo(pt.x, pt.y));
            ctx.lineTo(points[n - 1].x, padT + ih);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            points.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, state.hover === points.indexOf(pt) ? 6 : 4.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            if (state.hover !== undefined && state.points[state.hover]) {
                const pt = state.points[state.hover];
                drawTooltip(ctx, pt, `${pt.date} · ${pt.tier}`, W);
            }
        }

        function drawTooltip(ctx, pt, text, W) {
            ctx.font = '700 11px -apple-system, "Segoe UI", Roboto, sans-serif';
            const tw = ctx.measureText(text).width + 16;
            const th = 22;
            let bx = pt.x + 10;
            if (bx + tw > W - 4) bx = pt.x - tw - 10;
            let by = pt.y - th - 8;
            if (by < 4) by = pt.y + 10;

            ctx.fillStyle = 'rgba(15, 17, 25, 0.95)';
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(bx, by, tw, th, 6);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#fbbf24';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, bx + tw / 2, by + th / 2 + 0.5);
            ctx.textAlign = 'left';
        }

        function loadHistoryChart(username, gamemode) {
            const player = playersData.find(p => p.username === username);
            const canvas = document.getElementById('historyChart');
            if (!canvas) return;

            if (!player || !player.history || !player.history[gamemode]) {
                drawTierChart(canvas, []);
                return;
            }
            drawTierChart(canvas, player.history[gamemode]);
        }

        window.addEventListener('resize', () => {
            if (chartState) {
                drawTierChart(chartState.canvas, chartState.entries);
            }
        });

        /* ---------- Globální klávesy ---------- */
        window.addEventListener('keydown', (e) => {
            if (e.key === '/' &&
                document.activeElement !== document.getElementById('search') &&
                document.activeElement !== document.getElementById('compare-search-input')) {
                e.preventDefault();
                document.getElementById('search').focus();
            }
            if (e.key === 'Escape') {
                closeModal('vs-modal');
                closeModal('compare-select-modal');
                closeModal('modal');
            }
        });

        document.getElementById('refresh-btn').addEventListener('click', loadData);

        window.onload = loadData;
    </script>
</body>
