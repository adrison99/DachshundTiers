    <script>
        const tierConfig = {
            'HT1': { points: 60, label: 'HT1' },
            'LT1': { points: 48, label: 'LT1' },
            'RHT1': { points: 54, label: 'RHT1' },
            'RLT1': { points: 44, label: 'RLT1' },
            'HT2': { points: 32, label: 'HT2' },
            'LT2': { points: 24, label: 'LT2' },
            'RHT2': { points: 29, label: 'RHT2' },
            'RLT2': { points: 22, label: 'RLT2' },
            'HT3': { points: 16, label: 'HT3' },
            'LT3': { points: 10, label: 'LT3' },
            'RHT3': { points: 14, label: 'RHT3' },
            'RLT3': { points: 8, label: 'RLT3' },
            'HT4': { points: 5,  label: 'HT4' },
            'LT4': { points: 3,  label: 'LT4' },
            'RHT4': { points: 4,  label: 'RHT4' },
            'RLT4': { points: 2,  label: 'RLT4' },
            'HT5': { points: 2,  label: 'HT5' },
            'LT5': { points: 1,  label: 'LT5' },
            'RHT5': { points: 1,  label: 'RHT5' },
            'RLT5': { points: 1,  label: 'RLT5' }
        };

        const tierOrder = ['HT1','LT1','RHT1','RLT1','HT2','LT2','RHT2','RLT2','HT3','LT3','RHT3','RLT3','HT4','LT4','RHT4','RLT4','HT5','LT5','RHT5','RLT5'];

        let playersData = [];
        let currentTab = 'Overall';
        let chartInstance = null;
        let activeModalPlayer = null;
        let showRetired = false;

        function getImgPath(filename) {
            return filename; 
        }

        // Stabilní 3D render skinu podle jména hráče (Crafatar API - spolehlivě vrací skin podle IGN)
        function getSkinUrl(username) {
            return `https://crafatar.com/renders/body/${username}?scale=2&default=MHF_Steve&overlay`;
        }

        function getSortedModes(modes) {
            if (!modes) return [];
            return Object.entries(modes).sort((a, b) => {
                const idxA = tierOrder.indexOf(a[1]);
                const idxB = tierOrder.indexOf(b[1]);
                return (idxA !== -1 ? idxA : 999) - (idxB !== -1 ? idxB : 999);
            });
        }

        function getTierBadgeStyle(tier) {
            const t = tier.toUpperCase();
            if (t.includes('1')) {
                return 'border-amber-400 bg-amber-500/15 text-amber-300 shadow-[0_0_15px_rgba(251,191,36,0.35)]';
            } else if (t.includes('2')) {
                return 'border-zinc-300 bg-zinc-500/15 text-zinc-200 shadow-[0_0_15px_rgba(212,212,216,0.25)]';
            } else if (t.includes('3')) {
                return 'border-amber-600 bg-amber-600/15 text-amber-400 shadow-[0_0_15px_rgba(217,119,6,0.3)]';
            } else if (t.includes('4')) {
                return 'border-purple-500 bg-purple-500/15 text-purple-400 shadow-[0_0_15px_rgba(168,85,247,0.3)]';
            } else {
                return 'border-indigo-500 bg-indigo-500/15 text-indigo-400 shadow-[0_0_15px_rgba(99,102,241,0.3)]';
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== document.getElementById('search') && document.activeElement !== document.getElementById('compare-search-input')) {
                e.preventDefault();
                document.getElementById('search').focus();
            }
            if (e.key === 'Escape') {
                closeModal('modal');
                closeModal('compare-select-modal');
                closeModal('vs-modal');
            }
        });

        async function loadData() {
            try {
                document.getElementById('logo-img').src = getImgPath('logo.png');

                const response = await fetch('players.json?v=' + new Date().getTime());
                playersData = await response.json();
                
                const countElem = document.getElementById('player-count');
                if (countElem) countElem.innerText = playersData.length;

                renderRecentTests();
                render();
            } catch (e) {
                console.error("Chyba při načítání players.json", e);
            }
        }

        function renderRecentTests() {
            const container = document.getElementById('recent-tests-container');
            const listContainer = document.getElementById('recent-tests-list');
            if (!container || !listContainer) return;

            const recentTests = [];

            playersData.forEach(player => {
                if (!player.history) return;

                Object.keys(player.history).forEach(mode => {
                    const modeEntries = player.history[mode];
                    modeEntries.forEach((entry, idx) => {
                        const parts = entry.date.split('.');
                        if (parts.length === 3) {
                            const dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
                            
                            let trend = 'up';
                            if (idx > 0) {
                                const prevTier = modeEntries[idx - 1].tier;
                                const prevIdx = tierOrder.indexOf(prevTier);
                                const currIdx = tierOrder.indexOf(entry.tier);
                                if (currIdx > prevIdx) trend = 'down';
                                else if (currIdx === prevIdx) trend = 'same';
                            }

                            recentTests.push({
                                username: player.username,
                                mode: mode,
                                tier: entry.tier,
                                dateStr: entry.date,
                                dateObj: dateObj,
                                trend: trend
                            });
                        }
                    });
                });
            });

            if (recentTests.length === 0) {
                container.classList.add('hidden');
                return;
            }

            recentTests.sort((a, b) => b.dateObj - a.dateObj);

            const latest = recentTests.slice(0, 8);
            listContainer.innerHTML = '';

            latest.forEach(item => {
                let arrowIcon = '▲';
                let arrowColor = 'text-amber-400';
                if (item.trend === 'down') {
                    arrowIcon = '▼';
                    arrowColor = 'text-red-400';
                } else if (item.trend === 'same') {
                    arrowIcon = '•';
                    arrowColor = 'text-zinc-500';
                }

                const badgeStyle = getTierBadgeStyle(item.tier);
                const card = document.createElement('div');
                card.className = "flex items-center gap-3 bg-[#0e0e12] border border-amber-500/20 px-3.5 py-2.5 rounded-xl flex-shrink-0 shadow-[0_0_15px_rgba(0,0,0,0.6)] hover:border-amber-500/50 transition";
                card.innerHTML = `
                    <img src="${getSkinUrl(item.username)}" alt="${item.username}" class="w-6 h-10 object-contain flex-shrink-0">
                    <div class="flex flex-col">
                        <span class="font-extrabold text-xs text-white leading-tight">${item.username}</span>
                        <span class="text-[10px] text-amber-500/60 font-medium">${item.dateStr}</span>
                    </div>
                    <img src="${getImgPath(item.mode + '.png')}" alt="${item.mode}" class="w-12 h-12 object-contain ml-1">
                    <span class="px-2 py-0.5 rounded border font-black text-xs ${badgeStyle}">${item.tier}</span>
                    <span class="${arrowColor} text-xs font-black">${arrowIcon}</span>
                `;
                listContainer.appendChild(card);
            });

            container.classList.remove('hidden');
        }

        function calculateOverallPoints(player) {
            let total = 0;
            let hasRetired = false;
            if (player && player.modes) {
                for (let m in player.modes) {
                    const tier = player.modes[m];
                    const cfg = tierConfig[tier];
                    if (cfg) total += cfg.points;
                    if (tier.startsWith('R')) hasRetired = true;
                }
            }
            return { total, hasRetired };
        }

        function getFavoriteKit(player) {
            if (!player.modes || Object.keys(player.modes).length === 0) return 'Žádný';
            const sorted = getSortedModes(player.modes);
            if (sorted.length === 0) return 'Žádný';
            const [bestKit, bestTier] = sorted[0];
            return `${bestKit} (${bestTier})`;
        }

        function getRankTitle(player) {
            if (player.isBestCZSK) {
                return { title: 'BEST CZECHIA', bg: 'bg-amber-500/20 text-amber-300 border-amber-500/60 shadow-[0_0_15px_rgba(245,158,11,0.3)]' };
            }
            const points = player.overallScore || 0;
            if (points >= 240) return { title: 'THE BEST', bg: 'bg-amber-500/20 text-amber-400 border-amber-500/40 shadow-[0_0_10px_rgba(245,158,11,0.2)]' };
            if (points >= 210) return { title: 'Legenda', bg: 'bg-yellow-500/20 text-yellow-300 border-yellow-500/30' };
            if (points >= 180) return { title: 'Elita', bg: 'bg-amber-600/20 text-amber-400 border-amber-600/30' };
            if (points >= 120) return { title: 'Expert', bg: 'bg-orange-500/20 text-orange-400 border-orange-500/30' };
            if (points >= 70)  return { title: 'Úspěšný', bg: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' };
            if (points >= 30)  return { title: 'Pokročilý', bg: 'bg-zinc-500/20 text-zinc-300 border-zinc-500/30' };
            return { title: 'Začátečník', bg: 'bg-zinc-800 text-zinc-400 border-zinc-700' };
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('#tabs button').forEach(btn => {
                btn.className = "px-4 py-2 rounded-lg font-bold text-gray-400 hover:text-amber-300 hover:bg-amber-500/10 transition flex items-center gap-2";
            });
            const activeBtn = document.getElementById(`tab-${tabId}`);
            if (activeBtn) {
                activeBtn.className = "px-5 py-2.5 rounded-lg font-bold transition bg-amber-500 text-black shadow-[0_0_15px_rgba(245,158,11,0.4)] flex items-center gap-2";
            }

            const retiredBox = document.getElementById('retired-container');
            if (tabId === 'Overall') {
                retiredBox.classList.add('hidden');
            } else {
                retiredBox.classList.remove('hidden');
            }

            render();
        }

        function toggleRetired() {
            showRetired = !showRetired;
            const toggleBtn = document.getElementById('toggle-retired-btn');
            if (showRetired) {
                toggleBtn.className = "px-4 py-2 rounded-full font-bold text-amber-300 bg-amber-500/15 border border-amber-500/60 transition flex items-center gap-2 text-xs shadow-[0_0_15px_rgba(245,158,11,0.2)]";
            } else {
                toggleBtn.className = "px-4 py-2 rounded-full font-bold text-gray-400 hover:text-amber-300 bg-[#101014] border border-amber-500/30 hover:border-amber-500 transition flex items-center gap-2 text-xs";
            }
            render();
        }

        function renderPlayerCard(player, isRetired = false) {
            const rawTier = player.modes[currentTab];
            const isHT = rawTier.includes('HT');
            
            const cardClass = isHT ? 'player-card-ht' : 'player-card-lt';
            
            const item = document.createElement('div');
            item.className = `flex items-center justify-between p-2.5 ${cardClass} rounded-2xl cursor-pointer transition group duration-200 hover:scale-[1.02] shadow-sm hover:border-amber-500/60`;
            item.onclick = () => openPlayerModal(player);
            
            let retiredBadge = isRetired ? `<span class="px-2 py-0.5 bg-[#1f1610] border border-amber-500/40 text-amber-300 font-black text-[10px] rounded-md tracking-wider">R</span>` : '';

            item.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden">
                    <img src="${getSkinUrl(player.username)}" alt="${player.username}" class="w-8 h-12 object-contain flex-shrink-0 drop-shadow-[0_0_8px_rgba(245,158,11,0.3)]">
                    <span class="font-bold text-xs text-white truncate tracking-wide group-hover:text-amber-300 transition">${player.username}</span>
                </div>
                ${retiredBadge}
            `;
            return item;
        }

        function render() {
            const container = document.getElementById('leaderboard-container');
            if (!container) return;
            container.innerHTML = '';

            let processedPlayers = playersData.map(p => {
                const score = calculateOverallPoints(p);
                return { ...p, overallScore: score.total, isRetired: score.hasRetired };
            });

            if (currentTab === 'Overall') {
                container.className = "space-y-6";
                processedPlayers.sort((a, b) => {
                    if (a.isBestCZSK && !b.isBestCZSK) return -1;
                    if (!a.isBestCZSK && b.isBestCZSK) return 1;
                    if (a.isRetired !== b.isRetired) return a.isRetired ? 1 : -1;
                    return b.overallScore - a.overallScore;
                });

                if (processedPlayers.length >= 3) {
                    const top3 = [processedPlayers[1], processedPlayers[0], processedPlayers[2]];
                    const podiumContainer = document.createElement('div');
                    podiumContainer.className = "flex flex-col md:flex-row justify-center items-start gap-5 mb-14 mt-8";

                    top3.forEach((player, idx) => {
                        const rankNum = idx === 0 ? 2 : (idx === 1 ? 1 : 3);
                        const rankInfo = getRankTitle(player);

                        const card = document.createElement('div');
                        
                        let rankBorderGlow = "";
                        let badgeColor = "bg-amber-600 text-white";
                        let customHeightClass = "";

                        if (rankNum === 1) {
                            rankBorderGlow = "gold-glow-lg z-10 bg-[#16120d]";
                            badgeColor = "bg-amber-400 text-black";
                            customHeightClass = "md:w-[38%] py-8 px-8 order-first md:order-none";
                        } else if (rankNum === 2) {
                            rankBorderGlow = "gold-glow bg-[#100f12]";
                            badgeColor = "bg-zinc-300 text-black";
                            customHeightClass = "md:w-[31%] py-8 px-6 order-2 md:order-none md:mt-16";
                        } else if (rankNum === 3) {
                            rankBorderGlow = "gold-glow bg-[#120e0a]";
                            badgeColor = "bg-amber-700 text-white";
                            customHeightClass = "md:w-[31%] py-8 px-6 order-3 md:order-none md:mt-16";
                        }

                        card.className = `w-full ${customHeightClass} border-2 ${rankBorderGlow} rounded-3xl flex flex-col items-center cursor-pointer transition-all duration-300 hover:scale-[1.02] relative shadow-[0_0_30px_rgba(0,0,0,0.9)]`;
                        card.onclick = () => openPlayerModal(player);

                        const sortedModes = getSortedModes(player.modes);
                        
                        const badgesHTML = sortedModes.map(([mode, t]) => {
                            const badgeStyle = getTierBadgeStyle(t);
                            return `
                                <div class="flex flex-col items-center justify-center p-3 rounded-2xl border ${badgeStyle} bg-[#08080c] min-w-[85px] shadow-sm">
                                    <img src="${getImgPath(mode + '.png')}" alt="${mode}" class="w-16 h-16 object-contain mb-1.5">
                                    <span class="text-xs font-black tracking-wide">${t}</span>
                                </div>
                            `;
                        }).join('');

                        const skinSize = rankNum === 1 ? 'w-24 h-40' : 'w-20 h-32';
                        const nameSize = rankNum === 1 ? 'text-2xl' : 'text-xl';

                        card.innerHTML = `
                            <div class="w-8 h-8 rounded-xl ${badgeColor} flex items-center justify-center font-black text-sm mb-4 shadow-md">${rankNum}</div>
                            <div class="flex items-center justify-center gap-6 mb-4 w-full">
                                <span class="text-5xl font-black text-white italic tracking-tighter drop-shadow-[0_0_15px_rgba(255,255,255,0.4)]">${rankNum}.</span>
                                <img src="${getSkinUrl(player.username)}" alt="${player.username}" class="${skinSize} object-contain drop-shadow-[0_0_20px_rgba(245,158,11,0.3)]">
                            </div>
                            <h3 class="font-black text-white ${nameSize} tracking-wide text-center drop-shadow-[0_0_8px_rgba(255,255,255,0.2)]">${player.username}</h3>
                            <div class="flex items-center gap-2 mt-2 mb-6">
                                <span class="text-sm font-extrabold text-amber-400">${player.overallScore} bodů</span>
                                <span class="px-2.5 py-0.5 rounded text-[11px] font-extrabold border ${rankInfo.bg}">${rankInfo.title}</span>
                            </div>
                            <div class="w-full bg-[#050508] p-4 rounded-2xl border border-amber-500/20 flex flex-wrap gap-3 justify-center shadow-inner">${badgesHTML}</div>
                        `;
                        podiumContainer.appendChild(card);
                    });

                    container.appendChild(podiumContainer);
                }

                const listContainer = document.createElement('div');
                listContainer.className = "space-y-3";

                const restPlayers = processedPlayers.slice(3);

                restPlayers.forEach((player, index) => {
                    const rank = index + 4;
                    let rankBadge = `<div class="w-8 text-center font-extrabold text-amber-500/70 text-lg">${rank}.</div>`;

                    const rankInfo = getRankTitle(player);
                    const sortedModes = getSortedModes(player.modes);

                    const badgesHTML = `
                        <div class="flex flex-wrap gap-3 items-center">
                            ${sortedModes.map(([mode, t]) => {
                                const badgeStyle = getTierBadgeStyle(t);
                                return `
                                    <div class="flex flex-col items-center justify-center p-3 rounded-2xl border ${badgeStyle} bg-[#08080c] min-w-[80px] shadow-sm">
                                        <img src="${getImgPath(mode + '.png')}" alt="${mode}" class="w-16 h-16 object-contain mb-1.5">
                                        <span class="text-xs font-black tracking-wide">${t}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;

                    const row = document.createElement('div');
                    row.className = `flex items-center justify-between p-4 rounded-xl border border-amber-500/20 bg-[#0c0c10] cursor-pointer transition duration-200 hover:bg-[#121217] hover:border-amber-500/50 shadow-[0_0_15px_rgba(0,0,0,0.5)]`;
                    row.onclick = () => openPlayerModal(player);
                    row.innerHTML = `
                        <div class="flex items-center gap-4">
                            ${rankBadge}
                            <img src="${getSkinUrl(player.username)}" alt="${player.username}" class="w-10 h-16 object-contain drop-shadow-[0_0_8px_rgba(245,158,11,0.2)]">
                            <div class="flex flex-col justify-center">
                                <span class="font-bold text-white tracking-wide text-base md:text-lg leading-tight">${player.username}</span>
                                <div class="flex items-center gap-2 mt-1.5">
                                    <span class="text-sm font-bold text-amber-400">${player.overallScore} bodů</span>
                                    <span class="px-2.5 py-0.5 rounded text-xs font-bold border ${rankInfo.bg}">${rankInfo.title}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center">${badgesHTML}</div>
                    `;
                    listContainer.appendChild(row);
                });

                container.appendChild(listContainer);
            } else {
                container.className = "grid grid-cols-1 md:grid-cols-5 gap-4";

                const tiers = [1, 2, 3, 4, 5];

                tiers.forEach(tNum => {
                    const col = document.createElement('div');
                    col.className = "bg-[#09090d] border border-amber-500/20 rounded-3xl overflow-hidden flex flex-col min-h-[350px] shadow-[0_0_20px_rgba(0,0,0,0.8)]";

                    col.innerHTML = `
                        <div class="text-center py-3.5 tier-header-${tNum} font-black text-sm tracking-widest uppercase">
                            TIER ${tNum}
                        </div>
                        <div class="flex flex-col gap-2 p-3 flex-grow" id="tier-list-${tNum}"></div>
                    `;
                    container.appendChild(col);

                    const listContainer = col.querySelector(`#tier-list-${tNum}`);

                    const activeFiltered = processedPlayers.filter(p => {
                        if (!p.modes || !p.modes[currentTab]) return false;
                        const tStr = p.modes[currentTab];
                        return tStr.includes(tNum.toString()) && !tStr.startsWith('R');
                    });

                    activeFiltered.sort((a, b) => {
                        const tA = a.modes[currentTab];
                        const tB = b.modes[currentTab];
                        return tierOrder.indexOf(tA) - tierOrder.indexOf(tB);
                    });

                    activeFiltered.forEach(player => {
                        listContainer.appendChild(renderPlayerCard(player, false));
                    });

                    if (showRetired) {
                        const retiredFiltered = processedPlayers.filter(p => {
                            if (!p.modes || !p.modes[currentTab]) return false;
                            const tStr = p.modes[currentTab];
                            return tStr.includes(tNum.toString()) && tStr.startsWith('R');
                        });

                        retiredFiltered.sort((a, b) => {
                            const tA = a.modes[currentTab];
                            const tB = b.modes[currentTab];
                            return tierOrder.indexOf(tA) - tierOrder.indexOf(tB);
                        });

                        if (retiredFiltered.length > 0) {
                            const retiredDivider = document.createElement('div');
                            retiredDivider.className = "my-2 border-t border-amber-500/20";
                            listContainer.appendChild(retiredDivider);

                            retiredFiltered.forEach(player => {
                                listContainer.appendChild(renderPlayerCard(player, true));
                            });
                        }
                    }

                    if (activeFiltered.length === 0 && (!showRetired || listContainer.children.length === 0)) {
                        listContainer.innerHTML = `<div class="m-auto text-amber-500/40 font-bold text-xs tracking-wider uppercase">Prázdné</div>`;
                    }
                });
            }
        }

        const searchInput = document.getElementById('search');
        const searchDropdown = document.getElementById('search-dropdown');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                searchDropdown.classList.add('hidden');
                return;
            }

            const matches = playersData.map(p => {
                const score = calculateOverallPoints(p);
                return { ...p, overallScore: score.total };
            }).filter(p => p.username && p.username.toLowerCase().includes(query));

            if (matches.length > 0) {
                searchDropdown.innerHTML = '';
                matches.forEach(player => {
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-3 p-3 hover:bg-[#141218] cursor-pointer border-b border-amber-500/10 last:border-0 transition text-white";
                    div.onclick = () => {
                        openPlayerModal(player);
                        searchDropdown.classList.add('hidden');
                        searchInput.value = '';
                    };
                    div.innerHTML = `
                        <img src="${getSkinUrl(player.username)}" alt="${player.username}" class="w-6 h-10 object-contain">
                        <div class="flex flex-col">
                            <span class="font-bold text-sm">${player.username}</span>
                            <span class="text-xs text-amber-500/60">Skóre: ${player.overallScore}</span>
                        </div>
                    `;
                    searchDropdown.appendChild(div);
                });
                searchDropdown.classList.remove('hidden');
            } else {
                searchDropdown.classList.add('hidden');
            }
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) {
                searchDropdown.classList.add('hidden');
            }
        });

        function openPlayerModal(player) {
            activeModalPlayer = player;
            if (!player.overallScore) {
                player.overallScore = calculateOverallPoints(player).total;
            }

            document.getElementById('modal-avatar').src = getSkinUrl(player.username);
            document.getElementById('modal-username').innerText = player.username;
            
            const rankInfo = getRankTitle(player);
            document.getElementById('modal-rank-badge').innerText = rankInfo.title;
            document.getElementById('modal-points').innerText = player.overallScore;
            document.getElementById('modal-title-label').innerText = rankInfo.title === 'BEST CZECHIA' ? 'Legenda' : rankInfo.title;
            document.getElementById('modal-favorite-kit').innerHTML = getFavoriteKit(player);

            const kitsContainer = document.getElementById('modal-kits-container');
            kitsContainer.innerHTML = '';

            if (player.modes) {
                const sortedModes = getSortedModes(player.modes);
                sortedModes.forEach(([mode, tier]) => {
                    const badgeStyle = getTierBadgeStyle(tier);
                    const badgeDiv = document.createElement('div');
                    badgeDiv.className = "flex flex-col items-center gap-1 cursor-pointer group relative";
                    badgeDiv.onclick = () => loadHistoryChart(player.username, mode);
                    
                    badgeDiv.innerHTML = `
                        <div class="flex flex-col items-center justify-center p-3.5 rounded-2xl border ${badgeStyle} bg-[#08080c] min-w-[90px] transition group-hover:scale-110 shadow-md">
                            <img src="${getImgPath(mode + '.png')}" alt="${mode}" class="w-16 h-16 object-contain mb-1.5">
                            <span class="text-xs font-black tracking-wide">${tier}</span>
                        </div>
                    `;
                    kitsContainer.appendChild(badgeDiv);
                });

                if (sortedModes.length > 0) {
                    loadHistoryChart(player.username, sortedModes[0][0]);
                }
            } else {
                if (chartInstance) chartInstance.destroy();
            }

            document.getElementById('modal').classList.remove('hidden');
        }

        function loadHistoryChart(username, gamemode) {
            const player = playersData.find(p => p.username === username);
            const ctx = document.getElementById('historyChart').getContext('2d');
            
            if (chartInstance) chartInstance.destroy();

            if (!player || !player.history || !player.history[gamemode]) {
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels: ['Žádná data'], datasets: [] },
                    options: { responsive: true, maintainAspectRatio: false }
                });
                return;
            }

            const historyEntries = player.history[gamemode];
            const labels = historyEntries.map(h => h.date);
            const dataPoints = historyEntries.map(h => {
                const idx = tierOrder.indexOf(h.tier);
                return idx !== -1 ? (tierOrder.length - idx) : 0;
            });

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataPoints,
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        borderWidth: 3,
                        tension: 0.2,
                        pointBackgroundColor: '#fbbf24',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            grid: { color: 'rgba(245, 158, 11, 0.1)' },
                            ticks: {
                                color: '#d97706',
                                font: { size: 10, weight: 'bold' },
                                callback: function(value) {
                                    return tierOrder[tierOrder.length - value] || '';
                                }
                            }
                        },
                        x: { grid: { color: 'rgba(245, 158, 11, 0.1)' }, ticks: { color: '#d97706', font: { size: 10 } } }
                    }
                }
            });
        }

        function openCompareSelection() {
            if (!activeModalPlayer) return;
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('compare-with-name').innerText = activeModalPlayer.username;
            document.getElementById('compare-search-input').value = '';
            buildCompareList('');
            document.getElementById('compare-select-modal').classList.remove('hidden');
        }

        function buildCompareList(filterQuery) {
            const listContainer = document.getElementById('compare-players-list');
            listContainer.innerHTML = '';

            const filtered = playersData.map(p => {
                return { ...p, overallScore: calculateOverallPoints(p).total };
            }).filter(p => p.username !== activeModalPlayer.username && p.username.toLowerCase().includes(filterQuery.toLowerCase()));

            filtered.forEach((player) => {
                const rankInfo = getRankTitle(player);
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 bg-[#121216] hover:bg-[#1a1712] border border-amber-500/20 rounded-xl cursor-pointer transition text-white shadow-sm";
                div.onclick = () => startComparison(player);
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${getSkinUrl(player.username)}" alt="${player.username}" class="w-6 h-10 object-contain">
                        <span class="font-bold text-sm">${player.username}</span>
                    </div>
                    <div class="text-right text-xs text-gray-400">
                        <span>${player.overallScore} bodů · </span>
                        <span class="text-amber-400 font-bold">${rankInfo.title}</span>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        document.getElementById('compare-search-input').addEventListener('input', (e) => {
            buildCompareList(e.target.value);
        });

        function startComparison(opponent) {
            document.getElementById('compare-select-modal').classList.add('hidden');
            
            const p1 = activeModalPlayer;
            const p2 = opponent;
            const r1 = getRankTitle(p1);
            const r2 = getRankTitle(p2);

            document.getElementById('vs-p1-avatar').src = getSkinUrl(p1.username);
            document.getElementById('vs-p1-name').innerText = p1.username;
            document.getElementById('vs-p1-score').innerText = `${p1.overallScore} bodů`;
            document.getElementById('vs-p1-rank').innerText = r1.title;

            document.getElementById('vs-p2-avatar').src = getSkinUrl(p2.username);
            document.getElementById('vs-p2-name').innerText = p2.username;
            document.getElementById('vs-p2-score').innerText = `${p2.overallScore} bodů`;
            document.getElementById('vs-p2-rank').innerText = r2.title;

            const rowsContainer = document.getElementById('vs-kits-rows');
            rowsContainer.innerHTML = '';

            const allKits = ['GoldSMP', 'NetheriteSword', 'IronAxe', 'UHCMace', 'AnchorPvP', 'RandomPot', 'ShieldlessSMP', 'MolePvP'];

            allKits.forEach(kit => {
                const t1 = p1.modes ? p1.modes[kit] : null;
                const t2 = p2.modes ? p2.modes[kit] : null;

                const row = document.createElement('div');
                row.className = "flex items-center justify-between p-2.5 bg-[#0a0a0d] border border-amber-500/20 rounded-xl";
                row.innerHTML = `
                    <div class="w-24 text-center"><span class="px-3 py-1 rounded-lg text-xs font-black inline-block ${t1 ? 'text-amber-300 bg-[#141210] border border-amber-500/40 shadow-[0_0_10px_rgba(245,158,11,0.2)]' : 'text-zinc-600'}">${t1 || '---'}</span></div>
                    <div class="flex items-center gap-3 text-sm text-gray-300 font-bold"><img src="${getImgPath(kit + '.png')}" alt="${kit}" class="w-8 h-8 object-contain"><span class="text-xs text-amber-200/90 font-bold">${kit}</span></div>
                    <div class="w-24 text-center"><span class="px-3 py-1 rounded-lg text-xs font-black inline-block ${t2 ? 'text-amber-300 bg-[#141210] border border-amber-500/40 shadow-[0_0_10px_rgba(245,158,11,0.2)]' : 'text-zinc-600'}">${t2 || '---'}</span></div>
                `;
                rowsContainer.appendChild(row);
            });

            document.getElementById('vs-modal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
            if (modalId === 'vs-modal') {
                document.getElementById('compare-select-modal').classList.remove('hidden');
            }
        }

        function closeModalOnBackdrop(event, modalId) {
            if (event.target.id === modalId) {
                closeModal(modalId);
            }
        }

        window.onload = loadData;
    </script>
